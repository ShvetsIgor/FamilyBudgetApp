<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Конструктор категорий · одностраничные варианты</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    html, body { margin:0; padding:0; background:#EEE6D6; font-family:'Nunito', system-ui, sans-serif; color:#3D2C1F; }
    *, *::before, *::after { box-sizing: border-box; }
    button { font-family: inherit; }
  </style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons-pack.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" src="cc-shared.jsx"></script>
<script type="text/babel" src="cc-builder-shared.jsx"></script>
<script type="text/babel" src="cc-builder-a-outliner.jsx"></script>
<script type="text/babel" src="cc-builder-b-tiles.jsx"></script>
<script type="text/babel" src="cc-builder-c-palette.jsx"></script>
<script type="text/babel" src="cc-builder-d-shelves.jsx"></script>

<script type="text/babel" data-presets="env,react">
const W = 390, H = 844;

function MobileFrame({ children }) {
  return (
    <IOSDevice width={W} height={H}>
      <div style={{ width: '100%', height: '100%', paddingTop: 47 }}>{children}</div>
    </IOSDevice>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="cc-onepage"
        title="Конструктор категорий · одна страница, без шагов"
        subtitle="Без бюджета — он живёт на отдельной странице «Категории». Тут только структура: папки, подпапки, категории."
      >
        <DCArtboard id="A" label="A · Outliner (Notion-style)" width={W} height={H + 28}>
          <MobileFrame><CCBuilderA /></MobileFrame>
        </DCArtboard>
        <DCArtboard id="B" label="B · Тайлы + bottom sheet" width={W} height={H + 28}>
          <MobileFrame><CCBuilderB /></MobileFrame>
        </DCArtboard>
        <DCArtboard id="C" label="C · Command palette" width={W} height={H + 28}>
          <MobileFrame><CCBuilderC /></MobileFrame>
        </DCArtboard>
        <DCArtboard id="D" label="D · Мои + Библиотека (полки)" width={W} height={H + 28}>
          <MobileFrame><CCBuilderD /></MobileFrame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>

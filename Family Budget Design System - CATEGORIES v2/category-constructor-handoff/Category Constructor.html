<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Конструктор категорий · v2 (папки + категории)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    html, body { margin:0; padding:0; background:#EEE6D6; font-family:'Nunito', system-ui, sans-serif; color:#3D2C1F; }
    *, *::before, *::after { box-sizing: border-box; }
    button { font-family: inherit; }
  </style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons-pack.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" src="cc-shared.jsx"></script>
<script type="text/babel" src="cc-hub.jsx"></script>
<script type="text/babel" src="cc-v3-wizard.jsx"></script>
<script type="text/babel" src="cc-editor.jsx"></script>

<script type="text/babel" data-presets="env,react">
const W = 390, H = 844;

function MobileFrame({ children }) {
  return (
    <IOSDevice width={W} height={H}>
      <div style={{ width: '100%', height: '100%', paddingTop: 47 }}>{children}</div>
    </IOSDevice>
  );
}

function App() {
  const [data, setData] = React.useState(null);
  React.useEffect(() => { setData(makeSampleData()); }, []);
  if (!data) return <div style={{ padding: 40, color: '#8E7A66', fontWeight: 700 }}>Загрузка…</div>;

  return (
    <DesignCanvas>
      <DCSection
        id="hub"
        title="Категории · хаб"
        subtitle="Главная страница вкладки — папки как секции, категории flat внутри, loose и архив отдельно"
      >
        <DCArtboard id="hub-default" label="Базовый вид" width={W} height={H + 28}>
          <MobileFrame><CCHub initialData={data} /></MobileFrame>
        </DCArtboard>

        <DCArtboard id="hub-archive" label="С раскрытым архивом" width={W} height={H + 28}>
          <MobileFrame><CCHub initialData={data} startArchiveOpen /></MobileFrame>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="wizard"
        title="Конструктор · 3 шага"
        subtitle="Step 1: папки. Step 2: категории в папках. Step 3 (опционально): разобраться с loose-категориями."
      >
        <DCArtboard id="w1" label="Шаг 1 · Папки" width={W} height={H + 28}>
          <MobileFrame><CCV3 initialData={data} startStep={0} /></MobileFrame>
        </DCArtboard>

        <DCArtboard id="w2" label="Шаг 2 · Категории" width={W} height={H + 28}>
          <MobileFrame><CCV3 initialData={data} startStep={1} /></MobileFrame>
        </DCArtboard>

        <DCArtboard id="w2-open" label="Шаг 2 · «+ Добавить» открыт" width={W} height={H + 28}>
          <MobileFrame><CCV3 initialData={data} startStep={1} addPanelFolderId="groceries" /></MobileFrame>
        </DCArtboard>

        <DCArtboard id="w3" label="Шаг 3 · Loose · меню открыто" width={W} height={H + 28}>
          <MobileFrame><CCV3 initialData={data} startStep={2} /></MobileFrame>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="editor"
        title="Редактор категории"
        subtitle="Открывается тапом на категорию из хаба. Поле «Папка» позволяет перенести категорию в другую папку или сделать loose."
      >
        <DCArtboard id="edit-default" label="Редактирование · Супермаркет" width={W} height={H + 28}>
          <MobileFrame><CCEditor initialData={data} /></MobileFrame>
        </DCArtboard>

        <DCArtboard id="edit-folder" label="Папка-пикер открыт" width={W} height={H + 28}>
          <MobileFrame><CCEditor initialData={data} openFolderPicker /></MobileFrame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>

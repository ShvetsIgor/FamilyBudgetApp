<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Конструктор категорий</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    html, body { margin:0; padding:0; background:#EEE6D6; font-family:'Nunito', system-ui, sans-serif; color:#3D2C1F; }
    *, *::before, *::after { box-sizing: border-box; }
    button { font-family: inherit; }
  </style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Icon library (window.ICON_LIB) -->
<script type="text/babel" src="icons-pack.jsx"></script>

<!-- Frames + canvas -->
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<!-- Constructor variants -->
<script type="text/babel" src="cc-shared.jsx"></script>
<script type="text/babel" src="cc-hub.jsx"></script>
<script type="text/babel" src="cc-v1-catalog.jsx"></script>
<script type="text/babel" src="cc-v2-shelves.jsx"></script>
<script type="text/babel" src="cc-v3-wizard.jsx"></script>
<script type="text/babel" src="cc-editor.jsx"></script>

<script type="text/babel" data-presets="env,react">
const W = 390, H = 844;

function MobileFrame({ children }) {
  return (
    <IOSDevice width={W} height={H}>
      <div style={{ width: '100%', height: '100%', paddingTop: 47 /* status bar */, paddingBottom: 0 }}>
        {children}
      </div>
    </IOSDevice>
  );
}

function App() {
  const [data, setData] = React.useState(null);
  React.useEffect(() => {
    // Wait one tick so icons-pack populates window.ICON_LIB
    setData(makeSampleData());
  }, []);

  if (!data) {
    return <div style={{ padding: 40, color: '#8E7A66', fontWeight: 700 }}>Загрузка…</div>;
  }

  return (
    <DesignCanvas>
      <DCSection
        id="hub"
        title="Категории · хаб"
        subtitle="Главная страница вкладки — то, что видит юзер при заходе"
      >
        <DCArtboard id="hub-default" label="Текущий набор" width={W} height={H + 28}>
          <MobileFrame>
            <CCHub initialData={data} />
          </MobileFrame>
        </DCArtboard>

        <DCArtboard id="hub-expanded" label="С раскрытой библиотекой" width={W} height={H + 28}>
          <MobileFrame>
            <CCHub initialData={data} startInactiveOpen />
          </MobileFrame>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="wizard-flow"
        title="Конструктор · 4 шага"
        subtitle="Открывается из карточки «Конструктор» на хабе. Каждый артборд интерактивен."
      >
        <DCArtboard id="w1" label="Шаг 1 · Категории" width={W} height={H + 28}>
          <MobileFrame>
            <CCV3 initialData={data} startStep={0} />
          </MobileFrame>
        </DCArtboard>

        <DCArtboard id="w2" label="Шаг 2 · Уточни" width={W} height={H + 28}>
          <MobileFrame>
            <CCV3 initialData={data} startStep={1} />
          </MobileFrame>
        </DCArtboard>

        <DCArtboard id="w3" label="Шаг 3 · Бюджет" width={W} height={H + 28}>
          <MobileFrame>
            <CCV3 initialData={data} startStep={2} />
          </MobileFrame>
        </DCArtboard>

        <DCArtboard id="w4" label="Шаг 4 · Готово" width={W} height={H + 28}>
          <MobileFrame>
            <CCV3 initialData={data} startStep={3} />
          </MobileFrame>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="editor"
        title="Редактор категории"
        subtitle="Общий sheet — открывается из любого шага через «Своя» или ✎"
      >
        <DCArtboard id="edit" label="Редактирование · Продукты" width={W} height={H + 28}>
          <MobileFrame>
            <CCEditor initialData={data} />
          </MobileFrame>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="alternatives"
        title="Альтернативы (для сравнения)"
        subtitle="V1 и V2 — другие подходы к той же задаче"
      >
        <DCArtboard id="v1" label="V1 · Каталог с галочками" width={W} height={H + 28}>
          <MobileFrame>
            <CCV1 initialData={data} />
          </MobileFrame>
        </DCArtboard>

        <DCArtboard id="v2" label="V2 · Полки (моё / библиотека)" width={W} height={H + 28}>
          <MobileFrame>
            <CCV2 initialData={data} />
          </MobileFrame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Family Budget — разбить чек по позициям</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#EEE6D6; font-family: var(--font-sans); }
  .stage { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .scroll-x::-webkit-scrollbar, .scroll-y::-webkit-scrollbar { display:none; }
  .scroll-x, .scroll-y { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
</style>
</head>
<body>
<div class="stage"><div id="root"></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

const PRIMARY='#E07A5F', BROWN='#3D2C1F', CREAM='#FBF6EE', MUTED='#8E7A66', BORDER='#F0E8D8', CARD='#FFFFFF', SAGE='#81B29A';

/* sub.emoji used in split rows; each sub gets its own tint */
const CATEGORIES = [
  {emoji:'🥑', name:'Еда',          color:'#E07A5F', subs:[
    {emoji:'🛒', name:'Продукты'}, {emoji:'☕', name:'Кафе'},
    {emoji:'🍷', name:'Алкоголь'},  {emoji:'🍕', name:'Рестораны'},
    {emoji:'🧴', name:'Бытовая химия'},
  ]},
  {emoji:'🚲', name:'Транспорт',    color:'#F2CC8F', subs:[
    {emoji:'⛽', name:'Бензин'}, {emoji:'🚌', name:'Транспорт'},
    {emoji:'🚕', name:'Такси'},  {emoji:'🅿️', name:'Парковка'},
  ]},
  {emoji:'🏡', name:'Дом',          color:'#81B29A', subs:[
    {emoji:'🔑', name:'Аренда'}, {emoji:'💡', name:'Коммуналка'},
    {emoji:'🧹', name:'Быт'},     {emoji:'🛋️', name:'Мебель'},
  ]},
  {emoji:'🛍️', name:'Покупки',     color:'#8AA9D6', subs:[
    {emoji:'👕', name:'Одежда'}, {emoji:'📱', name:'Электроника'}, {emoji:'💄', name:'Косметика'},
  ]},
  {emoji:'💊', name:'Здоровье',     color:'#C97B84', subs:[]},
  {emoji:'🎬', name:'Развл.',       color:'#A8B89C', subs:[]},
  {emoji:'📚', name:'Учёба',        color:'#D4A574', subs:[]},
  {emoji:'👶', name:'Дети',         color:'#E9B384', subs:[]},
  {emoji:'🐷', name:'Копилка',      color:'#81B29A', subs:[]},
  {emoji:'📦', name:'Прочее',       color:'#8E7A66', subs:[]},
];

const Phone = ({ children }) => (
  <div style={{
    width: 390, height: 820,
    background: CREAM, borderRadius: 44, overflow:'hidden',
    boxShadow: '0 30px 60px rgba(61,44,31,.22), 0 0 0 9px #1a1a1a, 0 0 0 10px #2a2a2a',
    display:'flex', flexDirection:'column', position:'relative', color: BROWN,
  }}>
    <div style={{
      height: 36, padding: '0 26px', flexShrink: 0,
      display:'flex', alignItems:'center', justifyContent:'space-between',
      fontSize: 14, fontWeight: 800, position: 'relative',
    }}>
      <span>9:41</span>
      <span>● ●</span>
      <span style={{position:'absolute', top:8, left:'50%', transform:'translateX(-50%)', width:110, height:28, background:'#0a0a0a', borderRadius:'0 0 16px 16px'}}/>
    </div>
    {children}
    <div style={{position:'absolute', bottom: 8, left:'50%', transform:'translateX(-50%)', width:120, height:4, background:'rgba(0,0,0,.35)', borderRadius:999, zIndex:50}}/>
  </div>
);

const App = () => {
  // Total amount user entered when starting the transaction
  const [total, setTotal] = useState(1000);
  const [catIdx, setCatIdx] = useState(0); // Еда
  const cat = CATEGORIES[catIdx];

  // Splits: [{ subName, amount }]
  // Parent (general) gets total - sum(splits)
  const [splits, setSplits] = useState([
    { subName: 'Алкоголь', emoji:'🍷', amount: 40 },
  ]);

  // editingIdx: null = none, -1 = total, 0..N = splits[i]
  const [editingIdx, setEditingIdx] = useState(null);
  const [picker, setPicker] = useState(false);
  const scrollRef = useRef(null);

  const splitsSum = splits.reduce((s, x) => s + x.amount, 0);
  const parentLeftover = Math.max(0, total - splitsSum);

  // tap on numpad — updates whichever row is selected
  const tap = (k) => {
    const targetIdx = editingIdx ?? -1; // default edits total
    const apply = (cur) => {
      const s = String(cur);
      if (k === '⌫') return parseInt(s.slice(0, -1) || '0', 10);
      if (k === 'C') return 0;
      const n = parseInt(s === '0' ? String(k) : s + k, 10);
      return isNaN(n) ? cur : n;
    };
    if (targetIdx === -1) {
      const newTotal = apply(total);
      setTotal(newTotal);
      // clamp splits if needed
      if (splitsSum > newTotal) {
        const factor = newTotal / splitsSum || 0;
        setSplits(splits.map(s => ({ ...s, amount: Math.floor(s.amount * factor) })));
      }
    } else {
      const newAmt = apply(splits[targetIdx].amount);
      const otherSplits = splits.reduce((s, x, i) => i === targetIdx ? s : s + x.amount, 0);
      const clamped = Math.min(newAmt, total - otherSplits);
      const next = splits.map((s, i) => i === targetIdx ? { ...s, amount: clamped } : s);
      setSplits(next);
    }
  };

  const addSplit = (sub) => {
    setSplits([...splits, { subName: sub.name, emoji: sub.emoji, amount: 0 }]);
    setEditingIdx(splits.length);
    // keep picker open so user can keep adding
    requestAnimationFrame(() => {
      const el = scrollRef.current;
      if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
    });
  };
  const removeSplit = (i) => {
    setSplits(splits.filter((_, j) => j !== i));
    setEditingIdx(null);
  };
  const changeParent = (newIdx) => {
    setCatIdx(newIdx);
    setSplits([]);
    setEditingIdx(-1);
  };

  return (
    <Phone>
      {/* Top bar */}
      <div style={{display:'flex', alignItems:'center', gap:10, padding:'4px 16px'}}>
        <button style={{background:0, border:0, fontSize:20, color:BROWN, cursor:'pointer', padding:8, lineHeight:1}}>✕</button>
        <div style={{flex:1, textAlign:'center', fontSize:12, fontWeight:800, color:MUTED, textTransform:'uppercase', letterSpacing:'.08em'}}>Чек · {splits.length + 1} {splits.length === 0 ? 'позиция' : splits.length < 4 ? 'позиции' : 'позиций'}</div>
        <button style={{background:0, border:0, fontSize:18, padding:8, color:MUTED, cursor:'pointer', lineHeight:1}}>⋯</button>
      </div>

      {/* Total — large, tappable to edit */}
      <div onClick={()=>setEditingIdx(-1)} style={{
        margin:'0 16px', padding:'12px 16px', borderRadius:18, cursor:'pointer',
        background: editingIdx===-1 ? PRIMARY+'15' : 'transparent',
        border: `1.5px solid ${editingIdx===-1 ? PRIMARY : 'transparent'}`,
        display:'flex', alignItems:'baseline', justifyContent:'space-between',
      }}>
        <div style={{fontSize:11, fontWeight:800, color:MUTED, textTransform:'uppercase', letterSpacing:'.08em'}}>Итого по чеку</div>
        <div style={{display:'flex', alignItems:'baseline', gap:4}}>
          <span style={{fontSize:18, fontWeight:800, color:MUTED}}>₪</span>
          <span style={{fontSize:38, fontWeight:900, color:BROWN, letterSpacing:'-0.03em', lineHeight:1, fontVariantNumeric:'tabular-nums'}}>{total}</span>
        </div>
      </div>

      {/* Parent category — 2 rows × swipe */}
      <div className="scroll-x" style={{overflowX:'auto', padding:'10px 14px 6px'}}>
        <div style={{display:'grid', gridTemplateRows:'1fr 1fr', gridAutoFlow:'column', gridAutoColumns:'72px', gap:6}}>
          {CATEGORIES.map((c, i) => {
            const selected = i === catIdx;
            return (
              <button key={c.name} onClick={()=>changeParent(i)} style={{
                width: 72, height: 54, borderRadius: 14,
                background: selected ? c.color : CARD,
                color: selected ? 'white' : BROWN,
                border:0, fontFamily:'inherit', cursor:'pointer',
                display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2,
                fontSize: 10, fontWeight: 800,
                boxShadow: selected ? `0 4px 10px ${c.color}55` : '0 1px 3px rgba(61,44,31,.06)',
              }}>
                <span style={{fontSize:18, lineHeight:1}}>{c.emoji}</span>
                <span style={{lineHeight:1}}>{c.name}</span>
              </button>
            );
          })}
        </div>
      </div>

      {/* SPLIT TABLE — receipt-like */}
      <div ref={scrollRef} className="scroll-y" style={{flex:1, overflowY:'auto', padding:'8px 16px 6px', display:'flex', flexDirection:'column', gap:6, minHeight:0}}>
        {/* Parent (general) row */}
        <div onClick={()=>setEditingIdx(null)} style={{
          background: CARD, borderRadius:14, padding:'12px 14px',
          display:'flex', alignItems:'center', gap:12,
          boxShadow:'0 1px 3px rgba(61,44,31,.06)',
          border: `1.5px solid ${editingIdx===null ? 'transparent' : 'transparent'}`,
        }}>
          <div style={{width:36, height:36, borderRadius:11, background:cat.color+'22', display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, flexShrink:0}}>{cat.emoji}</div>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:14, fontWeight:800, color:BROWN}}>{cat.name} <span style={{fontWeight:600, color:MUTED, fontSize:12}}>· общее</span></div>
            <div style={{fontSize:11, color:MUTED, fontWeight:600, marginTop:1}}>остаток после уточнений</div>
          </div>
          <div style={{fontSize:18, fontWeight:900, color:BROWN, fontVariantNumeric:'tabular-nums'}}>₪{parentLeftover}</div>
        </div>

        {/* Split rows — children */}
        {splits.map((sp, i) => {
          const isEditing = editingIdx === i;
          return (
            <div key={i} onClick={()=>setEditingIdx(i)} style={{
              background: isEditing ? cat.color+'18' : CARD,
              borderRadius:12, padding:'8px 12px',
              display:'flex', alignItems:'center', gap:10, cursor:'pointer',
              boxShadow:'0 1px 2px rgba(61,44,31,.05)',
              border: `1.5px solid ${isEditing ? cat.color : 'transparent'}`,
              marginLeft: 18,
            }}>
              <div style={{width:26, height:26, borderRadius:8, background:cat.color+'22', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, flexShrink:0}}>{sp.emoji}</div>
              <div style={{flex:1, minWidth:0, fontSize:12, fontWeight:700, color:BROWN}}>{sp.subName}</div>
              <div style={{fontSize:14, fontWeight:900, color:BROWN, fontVariantNumeric:'tabular-nums'}}>₪{sp.amount}</div>
              <button onClick={(e)=>{e.stopPropagation(); removeSplit(i);}} style={{
                background:'transparent', border:0, fontSize:14, color:MUTED, cursor:'pointer', padding:'2px 4px',
              }}>✕</button>
            </div>
          );
        })}

        {/* Add subcategory */}
        {cat.subs.length > 0 && (
          <button onClick={()=>setPicker(!picker)} style={{
            background:'transparent', border:`2px dashed ${cat.color}77`,
            color: cat.color, borderRadius:14, padding:'10px 14px',
            fontFamily:'inherit', fontSize:13, fontWeight:800, cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center', gap:6,
          }}>
            <span style={{fontSize:18}}>＋</span> Уточнить позицию
          </button>
        )}

        {/* Picker grid — inline */}
        {picker && (
          <div style={{background:CARD, borderRadius:14, padding:10, boxShadow:'0 1px 3px rgba(61,44,31,.08)'}}>
            <div style={{fontSize:11, fontWeight:800, color:MUTED, textTransform:'uppercase', letterSpacing:'.08em', padding:'4px 4px 8px'}}>Подкатегория {cat.name}</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:5}}>
              {cat.subs.filter(s => !splits.find(x => x.subName === s.name)).map(s => (
                <button key={s.name} onClick={()=>addSplit(s)} style={{
                  background: cat.color+'14', border:0, padding:'5px 2px', borderRadius:9,
                  fontFamily:'inherit', fontSize:9, fontWeight:800, color:BROWN, cursor:'pointer',
                  display:'flex', flexDirection:'column', gap:1, alignItems:'center',
                }}>
                  <span style={{fontSize:13, lineHeight:1}}>{s.emoji}</span>{s.name}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Compact numpad */}
      <div style={{padding:'4px 12px 0', display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gridAutoRows: 44, gap:5}}>
        {[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k => (
          <button key={k} onClick={()=>tap(k)} style={{
            background: CARD, border:0, borderRadius:12, fontFamily:'inherit',
            fontSize: typeof k === 'number' ? 20 : 16,
            fontWeight: 800, color: (k==='⌫'||k==='C') ? MUTED : BROWN,
            cursor:'pointer', boxShadow:'0 1px 2px rgba(61,44,31,.05)',
          }}>{k}</button>
        ))}
      </div>

      {/* Save bar */}
      <div style={{padding:'10px 16px 18px', background: CREAM}}>
        <button style={{
          width:'100%', padding:'15px 0', borderRadius:18, border:0,
          background: PRIMARY, color:'white', fontFamily:'inherit',
          fontSize:15, fontWeight:900, cursor:'pointer',
          boxShadow:'0 12px 24px rgba(224,122,95,.38)',
          display:'flex', alignItems:'center', justifyContent:'center', gap:8,
        }}>
          <span style={{fontSize:20}}>{cat.emoji}</span>
          <span>Записать чек ₪{total}</span>
          <span style={{opacity:.75, fontWeight:700, fontSize:13}}>· {splits.length + 1} поз.</span>
        </button>
      </div>
    </Phone>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Family Budget — Быстрый ввод трат</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#EEE6D6; font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
const { useState } = React;
const { DesignCanvas, DCSection, DCArtboard } = window;

const PRIMARY='#E07A5F', SAGE='#81B29A', WARM='#F2CC8F', BROWN='#3D2C1F', CREAM='#FBF6EE', MUTED='#8E7A66', BORDER='#F0E8D8';

const CAT = [
  {emoji:'🥑', name:'Еда',         color:'#E07A5F', recent:true},
  {emoji:'🏡', name:'Дом',         color:'#81B29A'},
  {emoji:'🚲', name:'Транспорт',   color:'#F2CC8F', recent:true},
  {emoji:'🛍️', name:'Покупки',     color:'#8AA9D6'},
  {emoji:'☕', name:'Кафе',        color:'#D4A574', recent:true},
  {emoji:'💊', name:'Здоровье',    color:'#C97B84'},
  {emoji:'🎬', name:'Развл.',      color:'#A8B89C'},
  {emoji:'📦', name:'Прочее',      color:'#8E7A66'},
];

// ─────── Phone frame ───────
const Phone = ({ children }) => (
  <div style={{
    width: 390, height: 780,
    background:'#FBF6EE', borderRadius: 44, overflow:'hidden',
    boxShadow: '0 30px 60px rgba(61,44,31,.22), 0 0 0 9px #1a1a1a, 0 0 0 10px #2a2a2a',
    display:'flex', flexDirection:'column', position:'relative', color: BROWN,
  }}>
    <div style={{
      height: 36, padding: '0 26px', flexShrink: 0,
      display:'flex', alignItems:'center', justifyContent:'space-between',
      fontSize: 14, fontWeight: 800, position: 'relative',
    }}>
      <span>9:41</span>
      <span>● ●</span>
      <span style={{position:'absolute', top:8, left:'50%', transform:'translateX(-50%)', width:110, height:28, background:'#0a0a0a', borderRadius:'0 0 16px 16px'}}/>
    </div>
    {children}
    <div style={{position:'absolute', bottom: 8, left:'50%', transform:'translateX(-50%)', width:120, height:4, background:'rgba(0,0,0,.35)', borderRadius:999, zIndex:50}}/>
  </div>
);

// ══════════════════════════════════════════
// VARIANT A — Numpad calculator-style
// Big amount at top, category dock, custom numpad, save glued to numpad
// ══════════════════════════════════════════
const NumpadAdd = () => {
  const [amt, setAmt] = useState('48');
  const [cat, setCat] = useState('Еда');
  const [pay, setPay] = useState('💳');
  const tap = (k) => {
    if (k === '⌫') return setAmt(amt.slice(0, -1) || '0');
    if (k === '.') return amt.includes('.') ? null : setAmt(amt + '.');
    if (amt === '0') return setAmt(String(k));
    setAmt(amt + k);
  };
  const recent = CAT.filter(c => c.recent);
  return (
    <Phone>
      {/* Top bar — compact */}
      <div style={{display:'flex', alignItems:'center', gap:10, padding:'8px 18px 6px'}}>
        <button style={{background:0, border:0, fontSize:22, color:BROWN, cursor:'pointer', padding:6}}>✕</button>
        <div style={{flex:1, textAlign:'center', fontSize:13, fontWeight:800, color:MUTED, textTransform:'uppercase', letterSpacing:'.08em'}}>Новая трата</div>
        <button style={{background:0, border:0, fontSize:18, padding:6, color:MUTED, cursor:'pointer'}}>⋯</button>
      </div>

      {/* Amount — huge */}
      <div style={{textAlign:'center', padding:'10px 20px 6px'}}>
        <div style={{display:'flex', alignItems:'baseline', justifyContent:'center', gap:6}}>
          <span style={{fontSize:30, fontWeight:800, color:MUTED}}>₪</span>
          <span style={{fontSize:68, fontWeight:900, color:BROWN, letterSpacing:'-0.035em', lineHeight:1, fontVariantNumeric:'tabular-nums'}}>{amt}</span>
        </div>
        <div style={{display:'flex', justifyContent:'center', gap:8, marginTop:14}}>
          {['💳','💵','🏦'].map(p => (
            <button key={p} onClick={()=>setPay(p)} style={{
              background: pay===p?BROWN:'white', color: pay===p?'white':BROWN,
              border:0, padding:'7px 16px', borderRadius:999,
              fontSize:14, fontWeight:700, cursor:'pointer',
              boxShadow: pay===p ? '0 4px 10px rgba(61,44,31,.2)' : '0 1px 3px rgba(61,44,31,.06)',
            }}>{p}</button>
          ))}
          <button style={{background:'white', color:MUTED, border:0, padding:'7px 14px', borderRadius:999, fontSize:13, fontWeight:700, cursor:'pointer', boxShadow:'0 1px 3px rgba(61,44,31,.06)'}}>📅 сегодня</button>
        </div>
      </div>

      {/* Category dock — only recent + "all" */}
      <div style={{padding:'14px 18px 10px', display:'flex', gap:8, overflowX:'auto'}}>
        {recent.map(c => (
          <button key={c.name} onClick={()=>setCat(c.name)} style={{
            flexShrink:0, display:'flex', alignItems:'center', gap:7,
            background: cat===c.name ? c.color : 'white',
            color: cat===c.name ? 'white' : BROWN,
            border:0, padding:'10px 14px', borderRadius:16, fontFamily:'inherit',
            fontSize:13, fontWeight:800, cursor:'pointer',
            boxShadow: cat===c.name ? `0 6px 14px ${c.color}50` : '0 1px 3px rgba(61,44,31,.06)',
          }}>
            <span style={{fontSize:18}}>{c.emoji}</span>{c.name}
          </button>
        ))}
        <button style={{flexShrink:0, background:'transparent', border:`2px dashed ${MUTED}55`, padding:'10px 14px', borderRadius:16, fontFamily:'inherit', fontSize:13, fontWeight:700, color:MUTED, cursor:'pointer'}}>+ ещё</button>
      </div>

      {/* Numpad — chunky, thumb-friendly */}
      <div style={{flex:1, padding:'8px 12px 0', display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gridAutoRows:'1fr', gap:8}}>
        {[1,2,3,4,5,6,7,8,9,'.',0,'⌫'].map(k => (
          <button key={k} onClick={()=>tap(k)} style={{
            background:'white', border:0, borderRadius:18, fontFamily:'inherit',
            fontSize: typeof k==='number'?28:24, fontWeight:800, color: k==='⌫'?MUTED:BROWN,
            cursor:'pointer', boxShadow:'0 1px 3px rgba(61,44,31,.06)',
          }}>{k}</button>
        ))}
      </div>

      {/* Save bar — glued to bottom */}
      <div style={{padding:'12px 18px 20px', background:'#FBF6EE'}}>
        <button style={{
          width:'100%', padding:'18px 0', borderRadius:22, border:0,
          background:PRIMARY, color:'white', fontFamily:'inherit',
          fontSize:17, fontWeight:900, cursor:'pointer',
          boxShadow:'0 12px 26px rgba(224,122,95,.4)',
          display:'flex', alignItems:'center', justifyContent:'center', gap:10,
        }}>
          <span style={{fontSize:22}}>{CAT.find(c=>c.name===cat)?.emoji}</span>
          Записать ₪{amt}
        </button>
      </div>
    </Phone>
  );
};

// ══════════════════════════════════════════
// VARIANT B — One-tap preset amounts + smart pad
// "I spent 50/100/200 on coffee" — 2 taps to record
// ══════════════════════════════════════════
const QuickAdd = () => {
  const [amt, setAmt] = useState('');
  const [cat, setCat] = useState('Кафе');
  const presets = [10, 25, 50, 100, 200, 500];

  return (
    <Phone>
      <div style={{display:'flex', alignItems:'center', gap:10, padding:'8px 18px 14px'}}>
        <button style={{background:0, border:0, fontSize:22, color:BROWN, cursor:'pointer', padding:6}}>✕</button>
        <div style={{flex:1, fontSize:15, fontWeight:800, color:BROWN}}>Быстрая трата</div>
      </div>

      <div style={{padding:'0 20px', flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:14}}>
        {/* What */}
        <div style={{fontSize:11, fontWeight:800, color:MUTED, textTransform:'uppercase', letterSpacing:'.1em'}}>1 — На что</div>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:8}}>
          {CAT.map(c => (
            <button key={c.name} onClick={()=>setCat(c.name)} style={{
              background: cat===c.name ? c.color : 'white',
              color: cat===c.name ? 'white' : BROWN,
              border:0, padding:'14px 4px', borderRadius:16, fontFamily:'inherit',
              fontSize:11, fontWeight:800, cursor:'pointer',
              display:'flex', flexDirection:'column', gap:5, alignItems:'center',
              boxShadow: cat===c.name ? `0 6px 14px ${c.color}50` : '0 1px 3px rgba(61,44,31,.06)',
            }}>
              <span style={{fontSize:22}}>{c.emoji}</span>{c.name}
            </button>
          ))}
        </div>

        {/* How much */}
        <div style={{fontSize:11, fontWeight:800, color:MUTED, textTransform:'uppercase', letterSpacing:'.1em', marginTop:6}}>2 — Сколько</div>

        {/* Big amount display */}
        <div style={{background:'white', borderRadius:24, padding:'24px 22px', boxShadow:'0 2px 6px rgba(61,44,31,.04)', textAlign:'center'}}>
          <div style={{display:'flex', alignItems:'baseline', justifyContent:'center', gap:5}}>
            <span style={{fontSize:26, fontWeight:800, color:MUTED}}>₪</span>
            <span style={{fontSize:54, fontWeight:900, color: amt?BROWN:MUTED+'55', letterSpacing:'-0.03em', lineHeight:1, fontVariantNumeric:'tabular-nums'}}>{amt || '0'}</span>
          </div>
        </div>

        {/* Preset chips */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8}}>
          {presets.map(p => (
            <button key={p} onClick={()=>setAmt(String(p))} style={{
              background: amt===String(p) ? BROWN : 'white',
              color: amt===String(p) ? 'white' : BROWN,
              border:0, padding:'14px 0', borderRadius:16, fontFamily:'inherit',
              fontSize:18, fontWeight:900, cursor:'pointer', fontVariantNumeric:'tabular-nums',
              boxShadow: amt===String(p) ? '0 6px 14px rgba(61,44,31,.25)' : '0 1px 3px rgba(61,44,31,.06)',
            }}>₪{p}</button>
          ))}
        </div>
        <button onClick={()=>setAmt('')} style={{background:'transparent', border:`2px dashed ${MUTED}55`, padding:'12px 0', borderRadius:16, fontFamily:'inherit', fontSize:13, fontWeight:700, color:MUTED, cursor:'pointer'}}>
          Другая сумма — ввести вручную
        </button>
      </div>

      {/* Save bar */}
      <div style={{padding:'12px 18px 20px', background:'#FBF6EE', borderTop:`1px solid ${BORDER}`}}>
        <button disabled={!amt} style={{
          width:'100%', padding:'18px 0', borderRadius:22, border:0,
          background: amt ? PRIMARY : MUTED+'33', color: amt ? 'white' : MUTED,
          fontFamily:'inherit', fontSize:16, fontWeight:900, cursor: amt?'pointer':'not-allowed',
          boxShadow: amt ? '0 12px 26px rgba(224,122,95,.4)' : 'none',
        }}>
          {amt ? `Записать ₪${amt} на ${cat}` : 'Выбери сумму'}
        </button>
      </div>
    </Phone>
  );
};

// ══════════════════════════════════════════
// CURRENT for reference
// ══════════════════════════════════════════
const Current = () => (
  <Phone>
    <div style={{padding:'14px 22px 0', flex:1}}>
      <div style={{display:'flex', alignItems:'center', gap:10, padding:'8px 0 24px'}}>
        <button style={{background:0, border:0, fontSize:22, color:BROWN}}>←</button>
        <div style={{fontSize:22, fontWeight:800, color:BROWN}}>Новая запись</div>
      </div>
      <div style={{display:'flex', background:'white', borderRadius:999, padding:4, marginBottom:18, boxShadow:'0 2px 6px rgba(61,44,31,.04)'}}>
        <div style={{flex:1, padding:'10px 0', borderRadius:999, background:PRIMARY, color:'white', textAlign:'center', fontWeight:800, fontSize:13}}>Расход</div>
        <div style={{flex:1, padding:'10px 0', textAlign:'center', color:BROWN, fontWeight:800, fontSize:13}}>Доход</div>
      </div>
      <div style={{background:'white', borderRadius:22, padding:22, boxShadow:'0 2px 6px rgba(61,44,31,.04)'}}>
        <div style={{fontSize:11, color:MUTED, fontWeight:800, textTransform:'uppercase', letterSpacing:'.08em'}}>Сумма · ILS</div>
        <div style={{display:'flex', alignItems:'baseline', gap:6, marginTop:10}}>
          <span style={{fontSize:30, fontWeight:800, color:MUTED}}>₪</span>
          <span style={{fontSize:44, fontWeight:900, color:MUTED+'55'}}>0</span>
        </div>
      </div>
      <div style={{fontSize:14, fontWeight:700, color:BROWN, marginTop:22, marginBottom:10}}>Категория</div>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8}}>
        {CAT.slice(0,6).map(c => (
          <div key={c.name} style={{background:'white', borderRadius:18, padding:'14px 6px', display:'flex', flexDirection:'column', alignItems:'center', gap:6, fontWeight:700, fontSize:13, color:BROWN, boxShadow:'0 2px 4px rgba(61,44,31,.04)'}}>
            <span style={{fontSize:22}}>{c.emoji}</span>{c.name}
          </div>
        ))}
      </div>
      <div style={{position:'absolute', bottom:0, left:0, right:0, padding:'12px 22px 20px', background:'#FBF6EE', borderTop:`1px solid ${BORDER}`}}>
        <button style={{width:'100%', padding:'18px 0', borderRadius:22, border:0, background:PRIMARY, color:'white', fontSize:16, fontWeight:800, boxShadow:'0 12px 26px rgba(224,122,95,.3)'}}>
          Сохранить
        </button>
      </div>
    </div>
  </Phone>
);

function App() {
  return (
    <DesignCanvas>
      <DCSection id="add" title="Быстрый ввод трат — 2 концепта">
        <DCArtboard id="now" label="0 · Текущий — для сравнения" width={390} height={780}><Current/></DCArtboard>
        <DCArtboard id="numpad" label="A · Numpad — собственная клавиатура, без системной" width={390} height={780}><NumpadAdd/></DCArtboard>
        <DCArtboard id="quick" label="B · One-tap — категория + пресет суммы = 2 тапа" width={390} height={780}><QuickAdd/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

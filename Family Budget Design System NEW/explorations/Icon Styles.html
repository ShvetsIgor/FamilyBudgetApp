<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Family Budget — Icon styles</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#EEE6D6; font-family: var(--font-sans); color:#3D2C1F; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

/* ─── colors ─── */
const C = {
  food:'#E07A5F', transport:'#F2CC8F', home:'#81B29A', shopping:'#8AA9D6',
  health:'#C97B84', fun:'#A8B89C', edu:'#D4A574', kids:'#E9B384',
  savings:'#81B29A', other:'#8E7A66',
};
const INK = '#3D2C1F', CREAM = '#FBF6EE';

/* ════════════════════════════════════════════
 * STYLE A — Doodle: outline + flat fill + highlight
 * ════════════════════════════════════════════ */
const DoodleFood = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <ellipse cx="16" cy="19" rx="8.5" ry="11" fill={c} stroke={INK} strokeWidth="1.8"/>
    <circle cx="16" cy="20" r="3.6" fill={INK}/>
    <path d="M15.5 4 L14.5 9 M16.5 4 L17 9" stroke={INK} strokeWidth="1.8" strokeLinecap="round"/>
    <path d="M13 6 Q15 4.5 16 5.5" stroke={INK} strokeWidth="1.5" fill="none" strokeLinecap="round"/>
    <ellipse cx="12.5" cy="14" rx="1.5" ry="2.5" fill="white" opacity=".5"/>
  </svg>
);
const DoodleTransport = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <circle cx="8" cy="22" r="5" fill="none" stroke={INK} strokeWidth="1.8"/>
    <circle cx="24" cy="22" r="5" fill="none" stroke={INK} strokeWidth="1.8"/>
    <circle cx="8" cy="22" r="2" fill={c}/>
    <circle cx="24" cy="22" r="2" fill={c}/>
    <path d="M8 22 L16 12 L24 22 M16 12 L20 6 M14 6 L22 6" stroke={INK} strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
    <circle cx="16" cy="12" r="1.5" fill={INK}/>
  </svg>
);
const DoodleHome = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <path d="M5 16 L16 6 L27 16 L27 26 L5 26 Z" fill={c} stroke={INK} strokeWidth="1.8" strokeLinejoin="round"/>
    <rect x="13" y="18" width="6" height="8" fill={CREAM} stroke={INK} strokeWidth="1.5"/>
    <path d="M21 7 L21 11 L24 11 L24 9" fill={INK} stroke={INK} strokeWidth="1.5" strokeLinejoin="round"/>
    <path d="M7 16 L9 17" stroke="white" strokeWidth="1.5" opacity=".5" strokeLinecap="round"/>
  </svg>
);
const DoodleShopping = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <path d="M7 12 L25 12 L23 27 L9 27 Z" fill={c} stroke={INK} strokeWidth="1.8" strokeLinejoin="round"/>
    <path d="M11 12 Q11 5 16 5 Q21 5 21 12" stroke={INK} strokeWidth="1.8" fill="none" strokeLinecap="round"/>
    <circle cx="13" cy="17" r="1" fill={INK}/>
    <circle cx="19" cy="17" r="1" fill={INK}/>
    <path d="M9 14 L10 16" stroke="white" strokeWidth="1.5" opacity=".5" strokeLinecap="round"/>
  </svg>
);
const DoodleHealth = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <path d="M16 27 C8 22 4 16 4 12 A6 6 0 0 1 16 10 A6 6 0 0 1 28 12 C28 16 24 22 16 27 Z"
      fill={c} stroke={INK} strokeWidth="1.8" strokeLinejoin="round"/>
    <rect x="14" y="13" width="4" height="9" fill={CREAM}/>
    <rect x="11" y="16" width="10" height="4" fill={CREAM}/>
    <ellipse cx="10" cy="11" rx="2" ry="3" fill="white" opacity=".4"/>
  </svg>
);
const DoodleEdu = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <rect x="5" y="7" width="22" height="20" rx="2" fill={c} stroke={INK} strokeWidth="1.8"/>
    <rect x="5" y="7" width="6" height="20" fill={INK} opacity=".18"/>
    <path d="M14 11 L22 11 M14 15 L22 15 M14 19 L20 19" stroke={INK} strokeWidth="1.5" strokeLinecap="round"/>
    <circle cx="8" cy="11" r="1" fill="white"/>
    <circle cx="8" cy="15" r="1" fill="white"/>
  </svg>
);
const DoodleKids = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <circle cx="16" cy="14" r="9" fill={c} stroke={INK} strokeWidth="1.8"/>
    <circle cx="12" cy="13" r="1.5" fill={INK}/>
    <circle cx="20" cy="13" r="1.5" fill={INK}/>
    <path d="M12 17 Q16 20 20 17" stroke={INK} strokeWidth="1.8" fill="none" strokeLinecap="round"/>
    <path d="M10 6 L8 4 M22 6 L24 4 M16 4 L16 2" stroke={INK} strokeWidth="1.8" strokeLinecap="round"/>
    <ellipse cx="13" cy="10" rx="1.5" ry="2" fill="white" opacity=".5"/>
  </svg>
);
const DoodleSavings = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <ellipse cx="17" cy="18" rx="11" ry="8" fill={c} stroke={INK} strokeWidth="1.8"/>
    <path d="M8 11 L11 13" stroke={INK} strokeWidth="1.8" fill="none" strokeLinecap="round"/>
    <ellipse cx="26" cy="18" rx="3.5" ry="3" fill={c} stroke={INK} strokeWidth="1.8"/>
    <circle cx="25" cy="17" r="1" fill={INK}/>
    <circle cx="27" cy="17" r="1" fill={INK}/>
    <circle cx="13" cy="15" r="1.5" fill={INK}/>
    <rect x="14" y="11" width="6" height="1.6" rx="0.8" fill={INK}/>
    <rect x="10" y="25" width="3" height="3" rx="1" fill={INK}/>
    <rect x="21" y="25" width="3" height="3" rx="1" fill={INK}/>
  </svg>
);

/* ════════════════════════════════════════════
 * STYLE B — Soft Solids: pure shape, no outline
 * ════════════════════════════════════════════ */
const SolidFood = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <ellipse cx="16" cy="19" rx="8" ry="10" fill={c}/>
    <circle cx="16" cy="20" r="3.5" fill={CREAM}/>
    <rect x="15" y="3" width="2" height="6" rx="1" fill={c} opacity=".85"/>
  </svg>
);
const SolidTransport = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <rect x="4" y="11" width="24" height="11" rx="3" fill={c}/>
    <rect x="6" y="14" width="6" height="4" rx="1" fill={CREAM}/>
    <rect x="20" y="14" width="6" height="4" rx="1" fill={CREAM}/>
    <circle cx="9" cy="24" r="2.5" fill={c}/>
    <circle cx="23" cy="24" r="2.5" fill={c}/>
  </svg>
);
const SolidHome = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <path d="M5 16 L16 6 L27 16 L27 26 L5 26 Z" fill={c}/>
    <rect x="13" y="17" width="6" height="9" rx="1" fill={CREAM}/>
  </svg>
);
const SolidShopping = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <path d="M7 12 L25 12 L23 27 L9 27 Z" fill={c}/>
    <path d="M11 12 Q11 5 16 5 Q21 5 21 12" stroke={c} strokeWidth="2" fill="none" strokeLinecap="round"/>
  </svg>
);
const SolidHealth = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <path d="M16 27 C8 22 4 16 4 12 A6 6 0 0 1 16 10 A6 6 0 0 1 28 12 C28 16 24 22 16 27 Z" fill={c}/>
    <rect x="14" y="12" width="4" height="10" rx="1" fill={CREAM}/>
    <rect x="11" y="15" width="10" height="4" rx="1" fill={CREAM}/>
  </svg>
);
const SolidEdu = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <rect x="5" y="6" width="22" height="20" rx="3" fill={c}/>
    <path d="M11 11 L22 11 M11 15 L22 15 M11 19 L18 19" stroke={CREAM} strokeWidth="2" strokeLinecap="round"/>
  </svg>
);
const SolidKids = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <circle cx="16" cy="14" r="9" fill={c}/>
    <circle cx="12" cy="13" r="1.4" fill={CREAM}/>
    <circle cx="20" cy="13" r="1.4" fill={CREAM}/>
    <path d="M13 17 Q16 19 19 17" stroke={CREAM} strokeWidth="1.8" fill="none" strokeLinecap="round"/>
    <circle cx="7" cy="8" r="2" fill={c}/>
    <circle cx="25" cy="8" r="2" fill={c}/>
  </svg>
);
const SolidSavings = ({c}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    <ellipse cx="16" cy="18" rx="11" ry="8" fill={c}/>
    <ellipse cx="25" cy="17" rx="3" ry="2.5" fill={c}/>
    <circle cx="11" cy="16" r="1.2" fill={CREAM}/>
    <rect x="13" y="11" width="6" height="2" rx="1" fill={CREAM}/>
  </svg>
);

/* ════════════════════════════════════════════
 * STYLE C — Sticker 3D: two-tone + highlight
 * ════════════════════════════════════════════ */
const grad = (id, c) => (
  <defs>
    <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor={c}/>
      <stop offset="100%" stopColor={c} stopOpacity=".75"/>
    </linearGradient>
  </defs>
);
const dark = (c) => `color-mix(in srgb, ${c} 70%, #3D2C1F)`;

const StickerFood = ({c, id}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    {grad(id, c)}
    {/* basket */}
    <path d="M8 11 L28 11 L25 22 L11 22 Z" fill={dark(c)}/>
    <path d="M8 10 L28 10 L25 21 L11 21 Z" fill={`url(#${id})`}/>
    {/* handle */}
    <path d="M4 6 L8 6 L11 21" stroke={dark(c)} strokeWidth="2.2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
    {/* wheels */}
    <circle cx="13" cy="26" r="2" fill="#3D2C1F"/>
    <circle cx="23" cy="26" r="2" fill="#3D2C1F"/>
    {/* groceries */}
    <circle cx="15" cy="15" r="2" fill="#81B29A"/>
    <circle cx="20" cy="15" r="2" fill="#C9684E"/>
    <rect x="22" y="12" width="2.5" height="4" rx=".5" fill="#F2CC8F"/>
    <ellipse cx="11" cy="12" rx="1.5" ry="2" fill="white" opacity=".5"/>
  </svg>
);

const StickerFoodApple = null;
const StickerFoodBurger = null;
const StickerFoodCart = null;
const StickerTransport = ({c, id}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    {grad(id, c)}
    <rect x="3" y="11" width="26" height="12" rx="4" fill={dark(c)}/>
    <rect x="4" y="10" width="24" height="11" rx="3.5" fill={`url(#${id})`}/>
    <rect x="6" y="13" width="6" height="4" rx="1" fill="white" opacity=".85"/>
    <rect x="20" y="13" width="6" height="4" rx="1" fill="white" opacity=".85"/>
    <circle cx="9" cy="24" r="3" fill="#3D2C1F"/>
    <circle cx="23" cy="24" r="3" fill="#3D2C1F"/>
    <circle cx="9" cy="24" r="1.2" fill={c}/>
    <circle cx="23" cy="24" r="1.2" fill={c}/>
    <rect x="6" y="11" width="4" height="1.5" rx=".7" fill="white" opacity=".45"/>
  </svg>
);
const StickerHome = ({c, id}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    {grad(id, c)}
    <path d="M5 17 L16 7 L27 17 L27 27 L5 27 Z" fill={dark(c)}/>
    <path d="M5 16 L16 6 L27 16 L27 26 L5 26 Z" fill={`url(#${id})`}/>
    <rect x="13" y="17" width="6" height="9" rx="1" fill="#3D2C1F" opacity=".85"/>
    <circle cx="17.5" cy="22" r=".7" fill={c}/>
    <path d="M8 13 L11 10" stroke="white" strokeWidth="2" opacity=".6" strokeLinecap="round"/>
  </svg>
);
const StickerShopping = ({c, id}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    {grad(id, c)}
    <path d="M7 13 L25 13 L23 28 L9 28 Z" fill={dark(c)}/>
    <path d="M7 12 L25 12 L23 27 L9 27 Z" fill={`url(#${id})`}/>
    <path d="M11 12 Q11 5 16 5 Q21 5 21 12" stroke={dark(c)} strokeWidth="2.4" fill="none" strokeLinecap="round"/>
    <path d="M9 14 L11 15" stroke="white" strokeWidth="2" opacity=".5" strokeLinecap="round"/>
  </svg>
);
const StickerHealth = ({c, id}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    {grad(id, c)}
    <path d="M16 28 C8 23 4 17 4 13 A6 6 0 0 1 16 11 A6 6 0 0 1 28 13 C28 17 24 23 16 28 Z" fill={dark(c)}/>
    <path d="M16 27 C8 22 4 16 4 12 A6 6 0 0 1 16 10 A6 6 0 0 1 28 12 C28 16 24 22 16 27 Z" fill={`url(#${id})`}/>
    <rect x="14" y="12" width="4" height="10" rx="1" fill="white" opacity=".9"/>
    <rect x="11" y="15" width="10" height="4" rx="1" fill="white" opacity=".9"/>
    <ellipse cx="10" cy="11" rx="2" ry="3" fill="white" opacity=".4"/>
  </svg>
);
const StickerEdu = ({c, id}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    {grad(id, c)}
    <rect x="5" y="7" width="22" height="20" rx="3" fill={dark(c)}/>
    <rect x="5" y="6" width="22" height="20" rx="3" fill={`url(#${id})`}/>
    <rect x="5" y="6" width="5" height="20" rx="3" fill="#3D2C1F" opacity=".85"/>
    <path d="M14 11 L22 11 M14 15 L22 15 M14 19 L20 19" stroke="white" strokeWidth="2" strokeLinecap="round" opacity=".95"/>
    <ellipse cx="7.5" cy="9" rx="1.5" ry="2.5" fill="white" opacity=".4"/>
  </svg>
);
const StickerKids = ({c, id}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    {grad(id, c)}
    <circle cx="16" cy="15" r="9.5" fill={dark(c)}/>
    <circle cx="16" cy="14" r="9" fill={`url(#${id})`}/>
    <circle cx="12" cy="13" r="1.5" fill="#3D2C1F"/>
    <circle cx="20" cy="13" r="1.5" fill="#3D2C1F"/>
    <path d="M12 17 Q16 19.5 20 17" stroke="#3D2C1F" strokeWidth="1.8" fill="none" strokeLinecap="round"/>
    <circle cx="7" cy="8" r="2" fill={dark(c)}/>
    <circle cx="25" cy="8" r="2" fill={dark(c)}/>
    <ellipse cx="13" cy="10" rx="1.5" ry="2" fill="white" opacity=".5"/>
  </svg>
);
const StickerSavings = ({c, id}) => (
  <svg viewBox="0 0 32 32" width="100%" height="100%">
    {grad(id, c)}
    <ellipse cx="17" cy="19" rx="11" ry="8" fill={dark(c)}/>
    <ellipse cx="17" cy="18" rx="11" ry="8" fill={`url(#${id})`}/>
    <ellipse cx="26" cy="17" rx="3.5" ry="3" fill={dark(c)}/>
    <ellipse cx="26" cy="17" rx="3" ry="2.5" fill={`url(#${id})`}/>
    <circle cx="25" cy="17" r="0.8" fill="#3D2C1F"/>
    <circle cx="27" cy="17" r="0.8" fill="#3D2C1F"/>
    <circle cx="12" cy="15" r="1.4" fill="#3D2C1F"/>
    <rect x="14" y="11" width="6" height="1.8" rx="0.9" fill="#3D2C1F"/>
    <rect x="11" y="25" width="3" height="3" rx="1" fill={dark(c)}/>
    <rect x="21" y="25" width="3" height="3" rx="1" fill={dark(c)}/>
    <ellipse cx="12" cy="13" rx="2" ry="3" fill="white" opacity=".4"/>
    <path d="M8 12 L10 13" stroke={dark(c)} strokeWidth="1.8" strokeLinecap="round"/>
  </svg>
);

/* ════════════════════════════════════════════
 * Layout helpers
 * ════════════════════════════════════════════ */
const ICONS = [
  {key:'food',      label:'Еда',         color: C.food},
  {key:'transport', label:'Транспорт',   color: C.transport},
  {key:'home',      label:'Дом',         color: C.home},
  {key:'shopping',  label:'Покупки',     color: C.shopping},
  {key:'health',    label:'Здоровье',    color: C.health},
  {key:'edu',       label:'Учёба',       color: C.edu},
  {key:'kids',      label:'Дети',        color: C.kids},
  {key:'savings',   label:'Копилка',     color: C.savings},
];

const DOODLE = {
  food: DoodleFood, transport: DoodleTransport, home: DoodleHome, shopping: DoodleShopping,
  health: DoodleHealth, edu: DoodleEdu, kids: DoodleKids, savings: DoodleSavings,
};
const SOLID = {
  food: SolidFood, transport: SolidTransport, home: SolidHome, shopping: SolidShopping,
  health: SolidHealth, edu: SolidEdu, kids: SolidKids, savings: SolidSavings,
};
const STICKER = {
  food: StickerFood, transport: StickerTransport, home: StickerHome, shopping: StickerShopping,
  health: StickerHealth, edu: StickerEdu, kids: StickerKids, savings: StickerSavings,
};

const Tile = ({ I, color, label, kind }) => (
  <div style={{display:'flex', flexDirection:'column', alignItems:'center', gap:8, width:96}}>
    <div style={{
      width: 76, height: 76, borderRadius: 22,
      background: kind === 'doodle' ? CREAM : kind === 'solid' ? color+'22' : '#FFFFFF',
      display:'flex', alignItems:'center', justifyContent:'center',
      padding: kind === 'sticker' ? 12 : 14,
      boxShadow: kind === 'sticker' ? '0 8px 18px rgba(61,44,31,.10)' : '0 1px 3px rgba(61,44,31,.06)',
    }}>
      <I c={color} id={`g-${kind}-${label}`}/>
    </div>
    <div style={{fontSize: 12, fontWeight: 700, color: INK}}>{label}</div>
  </div>
);

const Grid = ({ kind, map }) => (
  <div style={{background:'#F6EFE2', padding: 28, borderRadius: 26, width: 880}}>
    <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap: 18}}>
      {ICONS.map(it => <Tile key={it.key} I={map[it.key]} color={it.color} label={it.label} kind={kind}/>)}
    </div>
  </div>
);

function App() {
  return (
    <DesignCanvas>
      <DCSection id="icons" title="Иконки категорий — 3 стиля">
        <DCArtboard id="doodle"  label="A · Doodle — рисованные, контур + заливка + блики" width={940} height={420}>
          <div style={{padding:30, background:'#EEE6D6', height:'100%', display:'flex', alignItems:'center', justifyContent:'center'}}>
            <Grid kind="doodle" map={DOODLE}/>
          </div>
        </DCArtboard>
        <DCArtboard id="solid"   label="B · Soft Solid — плоские, без контура, фон-тинт" width={940} height={420}>
          <div style={{padding:30, background:'#EEE6D6', height:'100%', display:'flex', alignItems:'center', justifyContent:'center'}}>
            <Grid kind="solid" map={SOLID}/>
          </div>
        </DCArtboard>
        <DCArtboard id="sticker" label="C · Sticker — объёмные, градиент + блик, ощущение наклейки" width={940} height={420}>
          <div style={{padding:30, background:'#EEE6D6', height:'100%', display:'flex', alignItems:'center', justifyContent:'center'}}>
            <Grid kind="sticker" map={STICKER}/>
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 18px; gap: 18px; flex-direction: row; align-items: center; }
  .mark { width: 100px; height: 100px; flex-shrink: 0; }
  .word { flex: 1; }
  .row { display: flex; gap: 16px; align-items: center; }
  .icon-tile { width: 56px; height: 56px; border-radius: 14px; }
  .icon-tile.cream { background: #FBF6EE; }
  .icon-tile.terra { background: #E07A5F; }
  .icon-tile.dark { background: #241B14; }
  .cap { font-size: 10px; font-weight: 800; color: hsl(var(--muted-foreground)); text-transform: uppercase; letter-spacing: .08em; }
</style>
<body>
  <img class="mark" src="../assets/logo-mark.svg" alt="logo">
  <div class="word">
    <img src="../assets/logo-wordmark.svg" alt="Family Budget" style="height:64px; display:block;">
    <div class="row" style="margin-top: 14px;">
      <div class="cap">App icon</div>
      <div class="icon-tile cream" style="background:url('../assets/logo-mark.svg') center/contain no-repeat #FBF6EE"></div>
      <div class="icon-tile terra" style="background:url('../assets/logo-mark.svg') center/contain no-repeat #FBF6EE; box-shadow: 0 0 0 2px #E07A5F"></div>
    </div>
  </div>
</body>

<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .cell { display: flex; flex-direction: column; gap: 6px; }
  .swatch { width: 100%; height: 64px; border-radius: 18px; }
  .name { font-size: 12px; font-weight: 700; }
  .hex { font-size: 11px; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }
</style>
<body>
  <div class="grid4">
    <div class="cell"><div class="swatch" style="background:#E07A5F"></div><div class="name">Primary · Terracotta</div><div class="hex">#E07A5F</div></div>
    <div class="cell"><div class="swatch" style="background:#81B29A"></div><div class="name">Sage · Income</div><div class="hex">#81B29A</div></div>
    <div class="cell"><div class="swatch" style="background:#F2CC8F"></div><div class="name">Warm Yellow · Savings</div><div class="hex">#F2CC8F</div></div>
    <div class="cell"><div class="swatch" style="background:#3D2C1F"></div><div class="name">Deep Brown · Text</div><div class="hex">#3D2C1F</div></div>
    <div class="cell"><div class="swatch" style="background:#FBF6EE; box-shadow: inset 0 0 0 1px hsl(var(--border))"></div><div class="name">Cream · Background</div><div class="hex">#FBF6EE</div></div>
    <div class="cell"><div class="swatch" style="background:#FFFFFF; box-shadow: inset 0 0 0 1px hsl(var(--border))"></div><div class="name">White · Card</div><div class="hex">#FFFFFF</div></div>
    <div class="cell"><div class="swatch" style="background:#8E7A66"></div><div class="name">Muted · Secondary text</div><div class="hex">#8E7A66</div></div>
    <div class="cell"><div class="swatch" style="background:#E07A5F33"></div><div class="name">Primary / 20</div><div class="hex">tints & badges</div></div>
  </div>
</body>

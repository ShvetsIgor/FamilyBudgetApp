<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  .row2 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .cell { display: flex; flex-direction: column; gap: 6px; }
  .swatch { width: 100%; height: 56px; border-radius: 12px; border: 1px solid hsl(var(--border)); }
  .name { font-size: var(--text-xs); font-weight: var(--weight-semibold); }
  .hex  { font-size: 11px; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }
  .scope-label { font-size: 11px; color: hsl(var(--muted-foreground)); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-top: 4px; }
</style>
<body>
  <div class="scope-label">Light</div>
  <div class="row2">
    <div class="cell"><div class="swatch" style="background: hsl(0 0% 100%);"></div><div class="name">background</div><div class="hex">#FFFFFF</div></div>
    <div class="cell"><div class="swatch" style="background: hsl(0 0% 100%); box-shadow: inset 0 0 0 1px hsl(214 32% 91%);"></div><div class="name">card</div><div class="hex">#FFFFFF + 1px border</div></div>
    <div class="cell"><div class="swatch" style="background: hsl(210 40% 96%);"></div><div class="name">muted</div><div class="hex">#F1F5F9</div></div>
    <div class="cell"><div class="swatch" style="background: hsl(214 32% 91%);"></div><div class="name">border</div><div class="hex">#E2E8F0</div></div>
    <div class="cell"><div class="swatch" style="background: hsl(222 47% 11%);"></div><div class="name">foreground</div><div class="hex">#0F172A</div></div>
  </div>
  <div class="scope-label">Dark</div>
  <div class="row2">
    <div class="cell"><div class="swatch" style="background: hsl(222 47% 8%);"></div><div class="name">background</div><div class="hex">#0B121F</div></div>
    <div class="cell"><div class="swatch" style="background: hsl(222 47% 11%);"></div><div class="name">card</div><div class="hex">#111827</div></div>
    <div class="cell"><div class="swatch" style="background: hsl(217 33% 17%);"></div><div class="name">muted</div><div class="hex">#1F2937</div></div>
    <div class="cell"><div class="swatch" style="background: hsl(217 33% 17%);"></div><div class="name">border</div><div class="hex">same as muted</div></div>
    <div class="cell"><div class="swatch" style="background: hsl(210 40% 98%);"></div><div class="name">foreground</div><div class="hex">#F8FAFC</div></div>
  </div>
</body>

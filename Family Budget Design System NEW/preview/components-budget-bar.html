<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 16px; gap: 14px; }
  .card { border: 1px solid hsl(var(--border)); background: hsl(var(--card)); border-radius: 16px; padding: 14px 16px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .tile { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .name { flex: 1; font-size: 14px; }
  .amt { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 999px; background: hsl(var(--muted)); overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; }
  .lbl { font-size: 11px; color: hsl(var(--muted-foreground)); margin-top: 4px; }
  .pill {
    border-radius: 999px; font-size: 11px; padding: 2px 8px;
    background: hsl(var(--muted)); color: hsl(var(--muted-foreground));
  }
  .pill.danger { background: hsl(0 84% 60% / .12); color: hsl(0 84% 60%); }
</style>
<body>
  <div class="card">
    <div class="row">
      <div class="tile" style="background:#f9731620;color:#f97316">🍽️</div>
      <span class="name">Food</span>
      <span class="amt">₪1,840</span>
      <span class="pill danger">⚠ Over</span>
    </div>
    <div class="bar"><div class="fill" style="width:100%; background: hsl(0 84% 60%);"></div></div>
    <div class="lbl">Limit ₪1,500 · 122 %</div>
  </div>
  <div class="card">
    <div class="row">
      <div class="tile" style="background:#3b82f620;color:#3b82f6">🏠</div>
      <span class="name">Home</span>
      <span class="amt">₪1,200</span>
      <span class="pill">/ ₪1,800</span>
    </div>
    <div class="bar"><div class="fill" style="width:66%; background: hsl(160 84% 39%);"></div></div>
    <div class="lbl">66 %</div>
  </div>
</body>

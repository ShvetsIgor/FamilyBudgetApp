<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { gap: 12px; }
  .row-b { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn-primary {
    background: hsl(var(--primary)); color: white;
    padding: 12px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
    border: 0; cursor: pointer;
  }
  .btn-primary.lg { padding: 14px 18px; font-size: 15px; box-shadow: 0 10px 28px hsl(221 83% 53% / 0.25); }
  .btn-secondary {
    background: hsl(var(--card)); color: hsl(var(--foreground));
    padding: 12px 16px; border-radius: 12px; font-weight: 500; font-size: 14px;
    border: 1px solid hsl(var(--border)); cursor: pointer;
  }
  .btn-ghost {
    background: transparent; color: hsl(var(--muted-foreground));
    padding: 8px 12px; border-radius: 12px; font-weight: 500; font-size: 14px;
    border: 0; cursor: pointer;
  }
  .btn-destructive {
    background: hsl(0 84% 60% / .05); color: hsl(0 84% 60%);
    padding: 12px 16px; border-radius: 16px; font-weight: 600; font-size: 14px;
    border: 1px solid hsl(0 84% 60% / .4); cursor: pointer;
  }
  .btn-link { color: hsl(var(--primary)); font-size: 13px; font-weight: 500; background: 0; border: 0; cursor: pointer; }
  .btn-link:hover { text-decoration: underline; }
  .fab {
    width: 80px; height: 80px; border-radius: 9999px;
    background: hsl(var(--primary)); color: white;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 28px hsl(221 83% 53% / 0.30);
    border: 0;
  }
  .fab-sm { width: 56px; height: 56px; background: hsl(160 84% 39%); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .fab-sm.amber { background: hsl(38 92% 50%); }
  .fab svg { width: 36px; height: 36px; }
  .fab-sm svg { width: 24px; height: 24px; }
  .lbl { font-size: 10px; text-transform: uppercase; color: hsl(var(--muted-foreground)); font-weight: 600; letter-spacing: 0.04em; }
</style>
<body>
  <div class="lbl">Buttons</div>
  <div class="row-b">
    <button class="btn-primary lg">Save Expense</button>
    <button class="btn-primary">Sign In</button>
    <button class="btn-secondary">Cancel</button>
    <button class="btn-ghost">← Back</button>
    <button class="btn-link">See all</button>
  </div>
  <div class="row-b">
    <button class="btn-destructive">Sign Out</button>
    <button class="btn-secondary" style="border-style: dashed; color: hsl(var(--muted-foreground));">+ Add income</button>
    <button class="btn-secondary" style="border-color: hsl(var(--primary)); color: hsl(var(--primary)); background: hsl(var(--primary)/.06); border-style: dashed;">+ Invite Member</button>
  </div>
  <div class="lbl">FAB / quick-add tiles</div>
  <div class="row-b" style="gap: 28px; padding-top: 4px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><div class="fab-sm fab" style="width:56px;height:56px;background:hsl(160 84% 39%);"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg></div><div class="lbl">Income</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><div class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div><div class="lbl">Expense (FAB)</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><div class="fab-sm fab" style="width:56px;height:56px;background:hsl(38 92% 50%);"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5c-1.5 0-2.8 .4-4 1 -1.2-.6-2.5-1-4-1a7 7 0 0 0-7 7c0 4 3.5 6.5 6 8l1 1 1-1c2.5-1.5 6-4 6-8a7 7 0 0 0 1-7Z"/></svg></div><div class="lbl">Savings</div></div>
  </div>
</body>

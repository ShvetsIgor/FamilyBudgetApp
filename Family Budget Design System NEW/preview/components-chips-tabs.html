<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { gap: 14px; padding: 16px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 500;
    background: hsl(var(--muted)); color: hsl(var(--muted-foreground));
    display: inline-flex; align-items: center; gap: 6px; border: 0;
  }
  .chip.on { background: hsl(var(--primary)); color: white; }
  .row { display: flex; gap: 8px; padding: 4px; background: hsl(var(--muted)); border-radius: 12px; }
  .row button { flex: 1; padding: 8px 0; border-radius: 8px; border: 0; font-size: 12px; font-weight: 500; color: hsl(var(--muted-foreground)); background: transparent; }
  .row button.on { background: hsl(var(--card)); color: hsl(var(--foreground)); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .label { font-size: 10px; color: hsl(var(--muted-foreground)); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
</style>
<body>
  <div class="label">Category filter chips</div>
  <div class="chips">
    <button class="chip on">All</button>
    <button class="chip">🍽️ Food</button>
    <button class="chip">🏠 Home</button>
    <button class="chip">🚗 Transport</button>
    <button class="chip">🛍️ Shopping</button>
  </div>
  <div class="label">Range selector (segmented)</div>
  <div class="row">
    <button class="on">This Month</button>
    <button>Last Month</button>
    <button>3 Months</button>
    <button>Year</button>
  </div>
</body>

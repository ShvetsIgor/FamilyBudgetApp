<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { gap: 0; padding: 18px 20px; }
  .list {
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    border-radius: 16px; overflow: hidden;
  }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border-top: 1px solid hsl(var(--border));
  }
  .row:first-child { border-top: 0; }
  .tile { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .body { flex: 1; min-width: 0; }
  .title { font-size: 14px; font-weight: 500; }
  .meta { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
  .amt { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip { background: hsl(var(--muted)); border-radius: 999px; padding: 2px 6px; font-size: 10px; }
  .group-head {
    background: hsl(var(--muted) / .5);
    padding: 6px 16px;
    display: flex; justify-content: space-between;
    font-size: 11px; font-weight: 600; color: hsl(var(--muted-foreground));
    text-transform: uppercase; letter-spacing: 0.04em;
  }
</style>
<body>
  <div class="list">
    <div class="group-head"><span>Today</span><span>-₪212.50</span></div>
    <div class="row">
      <div class="tile" style="background:#f9731620;color:#f97316">🛒</div>
      <div class="body"><div class="title">Shufersal</div><div class="meta"><span>Groceries</span><span>·</span><span>💳</span></div></div>
      <div class="amt">-₪148.50</div>
    </div>
    <div class="row">
      <div class="tile" style="background:#d9770620;color:#d97706">☕</div>
      <div class="body"><div class="title">Aroma</div><div class="meta"><span>Coffee</span><span class="chip">split 2</span><span>·</span><span>💵</span></div></div>
      <div class="amt">-₪32</div>
    </div>
    <div class="row">
      <div class="tile" style="background:#7c3aed20;color:#7c3aed">⛽</div>
      <div class="body"><div class="title">Sonol</div><div class="meta"><span>Fuel</span><span>·</span><span>💳</span><span>🔒</span></div></div>
      <div class="amt">-₪32</div>
    </div>
  </div>
</body>

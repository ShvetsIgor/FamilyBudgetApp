<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 16px; gap: 12px; }
  .hero {
    background: #E07A5F; color: #FBF6EE;
    border-radius: 32px; padding: 24px;
    position: relative; overflow: hidden;
    box-shadow: 0 16px 30px hsl(13 67% 63% / .25);
  }
  .hero::before { content:''; position:absolute; right:-30px; top:-30px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.10); }
  .hero::after  { content:''; position:absolute; right:30px; bottom:-30px; width:70px; height:70px; border-radius:50%; background:rgba(255,255,255,.08); }
  .lbl { font-size: 13px; font-weight: 700; opacity: .85; }
  .amt { font-size: 44px; font-weight: 900; margin-top: 4px; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .row { display:flex; gap: 20px; margin-top: 14px; font-size: 13px; font-weight: 700; }
</style>
<body>
  <div class="hero">
    <div class="lbl">Осталось в ноябре</div>
    <div class="amt">₪ 3 420</div>
    <div class="row"><span>↑ 8 200 доход</span><span>↓ 4 780 трат</span></div>
  </div>
</body>

<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { gap: 14px; }
  .input {
    width: 100%; border: 1px solid hsl(var(--border));
    background: hsl(var(--card)); border-radius: 12px;
    padding: 12px 16px; font-size: 14px; color: hsl(var(--foreground));
    outline: none;
  }
  .input::placeholder { color: hsl(var(--muted-foreground)); }
  .input.focused { border-color: hsl(var(--primary)); box-shadow: 0 0 0 3px hsl(var(--primary) / .2); }
  .label { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .amount-wrap {
    border: 1px solid hsl(var(--primary) / 0.25);
    background: hsl(var(--primary) / 0.05);
    border-radius: 16px; padding: 14px 16px;
  }
  .amount-wrap .ccy { display: flex; align-items: baseline; gap: 6px; }
  .amount-wrap .sym { color: hsl(var(--muted-foreground)); font-size: 28px; font-weight: 700; }
  .amount-wrap .val { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .seg { display: flex; gap: 4px; padding: 4px; background: hsl(var(--muted)); border-radius: 12px; }
  .seg button { flex: 1; padding: 8px 0; border-radius: 8px; border: 0; background: transparent; font-size: 13px; font-weight: 500; color: hsl(var(--muted-foreground)); cursor: pointer; }
  .seg button.on { background: hsl(var(--card)); color: hsl(var(--foreground)); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
</style>
<body>
  <div class="field">
    <div class="label">Email</div>
    <input class="input" placeholder="you@example.com" value="">
  </div>
  <div class="field">
    <div class="label">Password</div>
    <input class="input focused" type="password" value="••••••••">
  </div>
  <div class="row2">
    <div class="amount-wrap">
      <div style="font-size:11px;color:hsl(var(--muted-foreground));font-weight:600;letter-spacing:.04em;text-transform:uppercase;">Amount · ILS</div>
      <div class="ccy" style="margin-top:8px;"><span class="sym">₪</span><span class="val">148.50</span></div>
    </div>
    <div class="seg">
      <button class="on">Expenses</button>
      <button>Income</button>
    </div>
  </div>
</body>

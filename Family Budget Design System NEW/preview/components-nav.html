<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; width: 700px; }
  .frame { display: flex; gap: 22px; padding: 18px; align-items: flex-start; }
  .header {
    width: 320px;
    background: hsl(var(--background));
    border: 1px solid hsl(var(--border));
    border-radius: 14px;
    padding: 12px 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .header .logo { font-size: 18px; font-weight: 700; color: hsl(var(--primary)); }
  .header .tag { font-size: 11px; color: hsl(var(--muted-foreground)); font-weight: 500; margin-left: 6px; }
  .header .icons { display: flex; gap: 4px; }
  .header .icons .ico {
    width: 32px; height: 32px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    color: hsl(var(--muted-foreground));
  }

  .bottom {
    width: 320px;
    background: hsl(var(--background));
    border: 1px solid hsl(var(--border));
    border-radius: 14px;
    height: 64px;
    display: flex; align-items: center; justify-content: space-around;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: hsl(var(--muted-foreground));
  }
  .nav-item.active { color: hsl(var(--primary)); }
  .nav-item .lab { font-size: 10px; font-weight: 500; }
  .fab {
    width: 48px; height: 48px; border-radius: 9999px;
    background: hsl(var(--primary)); color: white;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 18px hsl(221 83% 53% / 0.30);
  }
  svg { width: 18px; height: 18px; }
  .fab svg { width: 22px; height: 22px; }
  .label { font-size: 10px; color: hsl(var(--muted-foreground)); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 4px 0; }
</style>
<body>
  <div class="frame" style="flex-direction:column; gap:18px;">
    <div class="label">App Header (sticky, backdrop-blur, h-14)</div>
    <div class="header">
      <div>
        <span class="logo">Budget</span>
        <span class="tag">Family</span>
      </div>
      <div class="icons">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.66a9 9 0 0 1 10 0"/></svg></div>
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></div>
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></div>
      </div>
    </div>
    <div class="label">Bottom Nav (4 tabs · center FAB)</div>
    <div class="bottom">
      <div class="nav-item">
        <div class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
      </div>
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        <span class="lab">Expenses</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span class="lab">Statistics</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg>
        <span class="lab">Analytics</span>
      </div>
    </div>
  </div>
</body>

<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 16px; gap: 12px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px 14px; }
  .ico { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ico svg { width: 22px; height: 22px; color: hsl(var(--muted-foreground)); stroke-width: 2; }
  .ico .lab { font-size: 10px; color: hsl(var(--muted-foreground)); }
  .note { font-size: 11px; color: hsl(var(--muted-foreground)); }
</style>

<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  .scale { display: flex; align-items: flex-end; gap: 14px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .swatch {
    background: hsl(221 83% 53% / 0.18);
    border: 1px solid hsl(221 83% 53% / 0.35);
    border-radius: 4px;
  }
  .step .px { font-size: 11px; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }
  .step .nm { font-size: 11px; font-weight: 600; }
  .tag { font-size: 11px; color: hsl(var(--muted-foreground)); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .demo {
    display: flex; gap: 16px; align-items: center;
    padding: 16px; background: hsl(var(--card));
    border: 1px solid hsl(var(--border)); border-radius: 16px;
  }
  .demo > .blk { background: hsl(var(--muted)); border-radius: 8px; height: 36px; flex: 1; }
</style>
<body>
  <div class="tag">Scale (Tailwind aligned)</div>
  <div class="scale">
    <div class="step"><div class="swatch" style="width:4px;height:4px"></div><div class="nm">1</div><div class="px">4</div></div>
    <div class="step"><div class="swatch" style="width:8px;height:8px"></div><div class="nm">2</div><div class="px">8</div></div>
    <div class="step"><div class="swatch" style="width:12px;height:12px"></div><div class="nm">3</div><div class="px">12</div></div>
    <div class="step"><div class="swatch" style="width:16px;height:16px"></div><div class="nm">4</div><div class="px">16</div></div>
    <div class="step"><div class="swatch" style="width:20px;height:20px"></div><div class="nm">5</div><div class="px">20</div></div>
    <div class="step"><div class="swatch" style="width:24px;height:24px"></div><div class="nm">6</div><div class="px">24</div></div>
    <div class="step"><div class="swatch" style="width:32px;height:32px"></div><div class="nm">8</div><div class="px">32</div></div>
  </div>
  <div class="tag">Rhythm in use — gap-4 between sections, gap-2 inside cards</div>
  <div class="demo">
    <div class="blk"></div><div class="blk"></div><div class="blk"></div>
  </div>
</body>

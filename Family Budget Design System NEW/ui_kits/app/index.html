<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Family Budget — Full UI Kit (Warm)</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; font-family: var(--font-sans); }
  body.light { background:#EEE6D6; }
  body.dark  { background:#15100A; }
  .stage { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 40px 20px; }
  .phone {
    width: 390px; height: 820px;
    background: var(--page-bg);
    border-radius: 44px; overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0, .35), 0 0 0 9px #1a1a1a, 0 0 0 10px #2a2a2a;
    display: flex; flex-direction: column; position: relative;
    color: var(--fg);
  }
  body.light .phone { --page-bg:#FBF6EE; --card:#FFFFFF; --fg:#3D2C1F; --muted:#8E7A66; --border:#F0E8D8; --hairline:#F0E8D8; }
  body.dark  .phone { --page-bg:#241B14; --card:#2F2419; --fg:#FBF6EE; --muted:#B8A088; --border:#3D2C1F; --hairline:#3D2C1F; }
  .status {
    height: 36px; padding: 0 26px; flex-shrink: 0;
    display:flex; align-items:center; justify-content:space-between;
    font-size: 14px; font-weight: 800; position: relative;
  }
  .status::before { content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:110px; height:28px; background:#0a0a0a; border-radius:0 0 16px 16px; }
  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 110px; }
  .scroll::-webkit-scrollbar { width: 0; }
  .home-indicator { position:absolute; bottom: 8px; left:50%; transform:translateX(-50%); width:120px; height:4px; background:rgba(0,0,0,.35); border-radius: 999px; z-index: 50; }
  body.dark .home-indicator { background:rgba(255,255,255,.4); }
</style>
</head>
<body class="light">
<div class="stage"><div id="root"></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect } = React;

/* ── Theme tokens (used inline in JS where CSS vars aren't enough) ── */
const useTheme = () => {
  const [dark, setDark] = useState(false);
  useEffect(() => {
    document.body.className = dark ? 'dark' : 'light';
  }, [dark]);
  return { dark, setDark,
    card:    dark ? '#2F2419' : '#FFFFFF',
    fg:      dark ? '#FBF6EE' : '#3D2C1F',
    muted:   dark ? '#B8A088' : '#8E7A66',
    border:  dark ? '#3D2C1F' : '#F0E8D8',
    bg:      dark ? '#241B14' : '#FBF6EE',
    shadow:  dark ? '0 6px 14px rgba(0,0,0,.3)' : '0 2px 6px rgba(61,44,31,.04)',
    shadowLg: dark ? '0 16px 30px rgba(0,0,0,.4)' : '0 16px 30px rgba(61,44,31,.12)',
  };
};

const PRIMARY = '#E07A5F', SAGE = '#81B29A', WARM = '#F2CC8F', BROWN = '#3D2C1F';

const CAT = [
  {emoji:'🥑', name:'Еда',         color:'#E07A5F', spent:1840, limit:1500},
  {emoji:'🏡', name:'Дом',         color:'#81B29A', spent:1200, limit:1800},
  {emoji:'🚲', name:'Транспорт',   color:'#F2CC8F', spent:860,  limit:1000},
  {emoji:'🛍️', name:'Покупки',     color:'#8AA9D6', spent:540,  limit:800},
  {emoji:'🎬', name:'Развлечения', color:'#D4A574', spent:240,  limit:500},
  {emoji:'💊', name:'Здоровье',    color:'#C97B84', spent:100,  limit:400},
];

const TX_TODAY = [
  {emoji:'🥑', cat:'Еда',       color:'#E07A5F', place:'Shufersal',   amt:148.50, meta:'💳'},
  {emoji:'☕', cat:'Кафе',      color:'#D4A574', place:'Aroma',        amt:32,    meta:'💵 split 2'},
  {emoji:'⛽', cat:'Транспорт', color:'#F2CC8F', place:'Sonol',        amt:120,   meta:'💳 🔒'},
];

/* ────────── Reusable bits ────────── */
const TopBar = ({ title, onBack, t, right }) => (
  <div style={{display:'flex', alignItems:'center', gap:10, padding:'14px 22px 18px'}}>
    {onBack && <button onClick={onBack} style={{background:0, border:0, fontSize:22, color:t.fg, cursor:'pointer', padding:0}}>←</button>}
    <div style={{fontSize:22, fontWeight:800, color:t.fg, flex:1}}>{title}</div>
    {right}
  </div>
);

const Card = ({ t, children, style, ...rest }) => (
  <div style={{background:t.card, borderRadius:22, boxShadow:t.shadow, ...style}} {...rest}>{children}</div>
);

const Pill = ({ children, on, onClick, t }) => (
  <button onClick={onClick} style={{
    border: 0, borderRadius: 999, padding:'8px 14px', fontFamily:'inherit',
    fontWeight: 700, fontSize: 13, cursor: 'pointer', whiteSpace:'nowrap',
    background: on ? PRIMARY : t.card, color: on ? 'white' : t.fg,
    boxShadow: on ? '0 6px 14px rgba(224,122,95,.3)' : t.shadow,
  }}>{children}</button>
);

const SectionLabel = ({ t, children, right }) => (
  <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', padding:'4px 4px 10px'}}>
    <div style={{fontSize:11, fontWeight:800, color:t.muted, textTransform:'uppercase', letterSpacing:'.08em'}}>{children}</div>
    {right && <div style={{fontSize:11, fontWeight:800, color:t.muted, fontVariantNumeric:'tabular-nums'}}>{right}</div>}
  </div>
);

const Row = ({ t, icon, color, title, sub, right, onClick, border }) => (
  <div onClick={onClick} style={{display:'flex', alignItems:'center', gap:12, padding:'14px 16px', borderTop: border ? `1px solid ${t.border}` : 0, cursor:onClick?'pointer':'default'}}>
    {icon && (
      <div style={{width:40, height:40, borderRadius:14, background:color+'22', display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, flexShrink:0}}>{icon}</div>
    )}
    <div style={{flex:1, minWidth:0}}>
      <div style={{fontSize:14, fontWeight:700, color:t.fg}}>{title}</div>
      {sub && <div style={{fontSize:12, color:t.muted, fontWeight:600, marginTop:2}}>{sub}</div>}
    </div>
    {right}
  </div>
);

/* Donut via conic-gradient */
const Donut = ({ size = 200, data }) => {
  const total = data.reduce((s, d) => s + d.v, 0);
  let acc = 0;
  const stops = data.map(d => {
    const start = (acc / total) * 360;
    acc += d.v;
    const end = (acc / total) * 360;
    return `${d.c} ${start}deg ${end}deg`;
  }).join(', ');
  return (
    <div style={{width:size, height:size, borderRadius:'50%', background:`conic-gradient(${stops})`, display:'flex', alignItems:'center', justifyContent:'center', position:'relative'}}>
      <div style={{width:size*0.62, height:size*0.62, borderRadius:'50%', background:'var(--page-bg)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center'}}>
        <div style={{fontSize:11, color:'var(--muted, #8E7A66)', fontWeight:800, textTransform:'uppercase', letterSpacing:'.08em'}}>Потрачено</div>
        <div style={{fontSize:24, fontWeight:900, color:'var(--fg, #3D2C1F)', fontVariantNumeric:'tabular-nums', letterSpacing:'-0.02em', marginTop:2}}>₪4 780</div>
      </div>
    </div>
  );
};

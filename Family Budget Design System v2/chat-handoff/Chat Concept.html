<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FamilyBudget · Chat concept — mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Nunito', system-ui, sans-serif; background: #efe6d7; }
  *, *::before, *::after { box-sizing: border-box; }
  #root { height: 100vh; }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; }
  /* Hide scrollbars inside artboards */
  ::-webkit-scrollbar { display: none; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="icons-pack.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="chat-app.jsx"></script>
<script type="text/babel" src="chat-screens.jsx"></script>
<script type="text/babel" src="chat-design-tokens.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { DesignCanvas, DCSection, DCArtboard, IOSDevice,
  ScreenMorning, ScreenClarify, ScreenWeekly, ScreenMenuOpen, DesignTokens } = window;

const PHONE_W = 390;
const PHONE_H = 844;
const PAD = 24;

function Frame({ children }) {
  return (
    <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: PAD, background: 'transparent', boxSizing: 'border-box' }}>
      <IOSDevice width={PHONE_W} height={PHONE_H}>
        {children}
      </IOSDevice>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="chat"
        title="FamilyBudget как чат · мобильный концепт"
        subtitle={'Главный экран — чат с локальным ботом. Парсер на правилах (без LLM): «хлеб 12» → ₪12 → Продукты; «65 кофе» → ₪65 → Кафе. ' +
          'Если не понял — спрашивает chip-кнопками и запоминает слово. Под крышкой — обычная Firestore-коллекция сообщений + transaction за каждым саженным сообщением. ' +
          'Все остальные разделы (статистика, конверты, копилки, регулярные, семья, настройки) — за гамбургером слева.'}
      >
        <DCArtboard id="morning" label="01 · Утро среды — bot brief + 3 траты" width={PHONE_W + PAD * 2} height={PHONE_H + PAD * 2}>
          <Frame><ScreenMorning/></Frame>
        </DCArtboard>

        <DCArtboard id="clarify" label="02 · Бот не понял — спрашивает категорию" width={PHONE_W + PAD * 2} height={PHONE_H + PAD * 2}>
          <Frame><ScreenClarify/></Frame>
        </DCArtboard>

        <DCArtboard id="weekly" label="03 · Воскресный отчёт — карточка в чате" width={PHONE_W + PAD * 2} height={PHONE_H + PAD * 2}>
          <Frame><ScreenWeekly/></Frame>
        </DCArtboard>

        <DCArtboard id="menu" label="04 · Гамбургер открыт — статистика, конверты, копилки" width={PHONE_W + PAD * 2} height={PHONE_H + PAD * 2}>
          <Frame><ScreenMenuOpen/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="tokens"
        title="Дизайн-система чат-концепта"
        subtitle={'Ссылка для Claude Code: палитра, типографическая шкала, радиусы/тени, ' +
          'ключевые компоненты в изоляции, и шпаргалка парсера (как работают правила без LLM).'}
      >
        <DCArtboard id="design-tokens" label="Токены · палитра + тип + компоненты + parser cheat sheet" width={980} height={1120}>
          <DesignTokens/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

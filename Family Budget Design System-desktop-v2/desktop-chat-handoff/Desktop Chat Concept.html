<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FamilyBudget · Chat concept — desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Nunito', system-ui, sans-serif; background: #efe6d7; }
  *, *::before, *::after { box-sizing: border-box; }
  #root { height: 100vh; }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="icons-pack.jsx"></script>
<script type="text/babel" src="chat-app.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="desktop-chat-shell.jsx"></script>
<script type="text/babel" src="desktop-chat-variants.jsx"></script>
<script type="text/babel" src="desktop-chat-v1-states.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { DesignCanvas, DCSection, DCArtboard,
  VariantClassic, VariantDashboard, VariantPinboard,
  SceneSectionOverlay, SceneBillsFocus,
  StateClarify, StateWeeklyRecap, StateEmpty, StateSearch,
  PanelBudgetFirst, PanelActivityFirst, PanelGoalsFirst, PanelCollapsed,
  TweaksPanel, useTweaks, TweakSection, TweakSlider, TweakToggle, TweakRadio,
} = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "density": "cozy",
  "chatWidth": 720,
  "rightPanel": true
}/*EDITMODE-END*/;

const W = 1440;
const H = 900;
const PAD = 28;

function Frame({ children }) {
  return (
    <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: PAD, background: 'transparent', boxSizing: 'border-box' }}>
      {children}
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const common = { dark: t.dark, density: t.density };

  return (
    <>
      <DesignCanvas>
        <DCSection
          id="layouts"
          title="Десктоп-чат · 3 направления"
          subtitle={
            'Три парадигмы, как чат-first FamilyBudget выглядит на десктопе. ' +
            'Все используют тот же rule-парсер и тот же дизайн-язык, что и мобайл. ' +
            'Tweaks → плотность, тёмная тема, ширина чата, правая панель применяются ко всем артбордам сразу.'
          }
        >
          <DCArtboard id="v1" label="V1 · Classic Messenger — telegram-style, привычный sidebar + chat + right panel" width={W + PAD * 2} height={H + PAD * 2}>
            <Frame><VariantClassic {...common} chatWidth={t.chatWidth} showRight={t.rightPanel}/></Frame>
          </DCArtboard>

          <DCArtboard id="v2" label="V2 · Live Dashboard Bubbles — карточки бота = мини-виджеты с графиками внутри" width={W + PAD * 2} height={H + PAD * 2}>
            <Frame><VariantDashboard {...common} chatWidth={Math.max(t.chatWidth, 720)} showRight={t.rightPanel}/></Frame>
          </DCArtboard>

          <DCArtboard id="v3" label="V3 · Workspace / Pinboard — чат слева, справа собственная доска куда тащишь карточки" width={W + PAD * 2} height={H + PAD * 2}>
            <Frame><VariantPinboard {...common} chatWidth={Math.min(t.chatWidth - 160, 560)}/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="scenes"
          title="Сцены и состояния"
          subtitle={
            'Сценарии поверх классического layout: раздел развёрнут как лист поверх чата (а не отдельная страница) ' +
            'и фокусировка на регулярных платежах в правой панели.'
          }
        >
          <DCArtboard id="overlay" label="07 · Конверты раскрыты поверх чата (sheet)" width={W + PAD * 2} height={H + PAD * 2}>
            <Frame><SceneSectionOverlay {...common} section="envelopes"/></Frame>
          </DCArtboard>

          <DCArtboard id="bills" label="08 · Утро четверга — бот зовёт в раздел Регулярные, правая панель развёрнута" width={W + PAD * 2} height={H + PAD * 2}>
            <Frame><SceneBillsFocus {...common}/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="v1-states"
          title="V1 · Ключевые состояния"
          subtitle={
            'Четыре состояния поверх Classic Messenger: бот не понял, ' +
            'воскресный отчёт, первый вход (empty) и локальный поиск через ⌘K.'
          }
        >
          <DCArtboard id="clarify" label="Состояние · Clarify — бот не понял «150», предлагает категорию" width={W + PAD * 2} height={H + PAD * 2}>
            <Frame><StateClarify {...common}/></Frame>
          </DCArtboard>

          <DCArtboard id="weekly" label="Состояние · Weekly recap — воскресенье 21:00, итог недели" width={W + PAD * 2} height={H + PAD * 2}>
            <Frame><StateWeeklyRecap {...common}/></Frame>
          </DCArtboard>

          <DCArtboard id="empty" label="Состояние · First time — пустой чат, подсказка как записать" width={W + PAD * 2} height={H + PAD * 2}>
            <Frame><StateEmpty {...common}/></Frame>
          </DCArtboard>

          <DCArtboard id="search" label="Состояние · Cmd+K search — поиск по истории и команды" width={W + PAD * 2} height={H + PAD * 2}>
            <Frame><StateSearch {...common}/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="panel-variants"
          title="Правая панель · вариации"
          subtitle={
            'Приоритет карточек меняется в зависимости от роли экрана. ' +
            'Рядом — «D» collapse-вид для узких окон и пользователей, которым нужен только статус.'
          }
        >
          <DCArtboard id="panel-a" label="A · Привычный — today + конверты + счета" width={420} height={780}>
            <PanelBudgetFirst {...common}/>
          </DCArtboard>
          <DCArtboard id="panel-b" label="B · Хроника — today + последние операции + счета" width={420} height={780}>
            <PanelActivityFirst {...common}/>
          </DCArtboard>
          <DCArtboard id="panel-c" label="C · Цели — today + копилки + счета" width={420} height={780}>
            <PanelGoalsFirst {...common}/>
          </DCArtboard>
          <DCArtboard id="panel-d" label="D · Свёрнуто — icon-rail с бейджами" width={136} height={780}>
            <PanelCollapsed {...common}/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Layout"/>
        <TweakSlider label="Ширина чат-колонки" value={t.chatWidth} min={560} max={900} step={20} unit="px"
                     onChange={(v) => setTweak('chatWidth', v)}/>
        <TweakToggle label="Правая панель" value={t.rightPanel}
                     onChange={(v) => setTweak('rightPanel', v)}/>

        <TweakSection label="Плотность"/>
        <TweakRadio label="Density" value={t.density}
                    options={['compact', 'cozy', 'comfortable']}
                    onChange={(v) => setTweak('density', v)}/>

        <TweakSection label="Тема"/>
        <TweakToggle label="Тёмная тема" value={t.dark}
                     onChange={(v) => setTweak('dark', v)}/>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
